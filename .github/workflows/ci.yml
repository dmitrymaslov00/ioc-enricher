name: CI

on:
  push:
  pull_request:
  
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Ruff
        run: python -m ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: python -m pytest